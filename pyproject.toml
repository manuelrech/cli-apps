[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-apps"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "pydantic",
    "httpx",
    "python-dotenv",
    "yfinance",
    "pyautogui",
]

[project.scripts]
clockify = "clockify.main:app"
cursor-mover = "cursor_mover.main:app"
finance = "etf.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*", "clockify*", "cursor_mover*", "etf*"]
